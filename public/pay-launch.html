<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="origin" />
    <meta name="robots" content="noindex" />
    <title>Opening secure payment…</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font: 600 16px system-ui, sans-serif;
            color: #08222B;
            background: #fff;
            text-align: center;
            padding: 24px;
        }
    </style>
</head>

<body>
    <p id="msg">Opening secure payment…</p>
    <script>
        (function () {
            var ALLOWED = ["jiopay.co.in"]; // add the exact gateway host if yours differs
            function allowed(h) {
                return ALLOWED.some(function (a) { return h === a || h.slice(-(a.length + 1)) === "." + a; });
            }
            var msg = document.getElementById("msg");
            var target;
            try { target = new URL(new URLSearchParams(location.search).get("u") || ""); }
            catch (e) { msg.textContent = "This payment link isn't valid. Please go back to the app and try again."; return; }
            if (target.protocol !== "https:" || !allowed(target.hostname)) {
                msg.textContent = "Blocked payment host: " + target.hostname;
                return;
            }
            try { sessionStorage.setItem("bbm_app_payment", "1"); } catch (e) { }
            location.replace(target.toString());
        })();
    </script>
</body>

</html>
